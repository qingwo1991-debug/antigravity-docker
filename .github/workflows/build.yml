name: 🐳 Build & Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制重新构建'
        required: false
        default: 'false'
  
  schedule:
    # 每天北京时间凌晨 3 点 (UTC 19:00) 检查更新
    - cron: '0 19 * * *'

env:
  # 请确保你在 GitHub Secrets 中配置了 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/antigravity
  GITHUB_REPO: lbjlaq/Antigravity-Manager

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      manager_version: ${{ steps.check.outputs.manager_version }}
      deb_url_amd64: ${{ steps.resolve_url.outputs.deb_url_amd64 }}
      deb_url_arm64: ${{ steps.resolve_url.outputs.deb_url_arm64 }}
      combined_version: ${{ steps.check.outputs.combined_version }}
    
    steps:
      - name: 📥 获取上游最新版本
        id: check
        run: |
          # 1. 获取最新 Tag (例如 v1.2.3 或 1.2.3)
          TAG_NAME=$(curl -fsSL "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest" | jq -r '.tag_name')
          
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "❌ 获取版本号失败，请检查 GitHub API 限制"
            exit 1
          fi

          echo "manager_version=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📌 上游最新版本: $TAG_NAME"
          
          # 生成组合版本号 (例如: v1.2.3-20240210)
          COMBINED_VERSION="${TAG_NAME}-$(date +%Y%m%d)"
          echo "combined_version=$COMBINED_VERSION" >> $GITHUB_OUTPUT

          # 2. 检查 Docker Hub 是否已存在此版本
          DOCKER_TAGS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_REPO }}/tags?page_size=100" 2>/dev/null | jq -r '.results[].name' 2>/dev/null || echo "")
          
          # 强制构建逻辑 OR 版本比对
          if [[ "${{ github.event.inputs.force_build }}" == "true" ]]; then
             echo "⚠️ 强制构建模式已开启"
             echo "should_build=true" >> $GITHUB_OUTPUT
          elif echo "$DOCKER_TAGS" | grep -q "^${TAG_NAME}$"; then
            echo "✅ 镜像版本 $TAG_NAME 已存在，跳过构建"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 发现新版本/未构建版本，准备构建"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔗 智能解析下载链接 (AMD64 & ARM64)
        id: resolve_url
        if: steps.check.outputs.should_build == 'true'
        run: |
          VERSION="${{ steps.check.outputs.manager_version }}"
          REPO="${{ env.GITHUB_REPO }}"
          API_URL="https://api.github.com/repos/$REPO/releases/latest"
          
          echo "🔍 [AMD64] 开始寻找下载链接..."
          
          # --- 步骤 1: 获取 AMD64 (优先构造，失败则搜 API) ---
          
          # 尝试构造 URL (假设去掉了 'v' 前缀)
          NO_V_VERSION="${VERSION#v}"
          GUESS_AMD64="https://github.com/$REPO/releases/download/$VERSION/Antigravity-Manager_${NO_V_VERSION}_amd64.deb"
          
          if curl --output /dev/null --silent --head --fail "$GUESS_AMD64"; then
            echo "✅ [AMD64] 猜中标准命名链接: $GUESS_AMD64"
            FINAL_AMD64="$GUESS_AMD64"
          else
            echo "⚠️ [AMD64] 标准命名无效，切换到 API 搜索模式..."
            # 获取 Release JSON
            API_JSON=$(curl -fsSL "$API_URL")
            # 搜索包含 amd64.deb 的文件
            FINAL_AMD64=$(echo "$API_JSON" | jq -r '.assets[] | select(.name | contains("amd64.deb")) | .browser_download_url' | head -n 1)
          fi
          
          if [ -z "$FINAL_AMD64" ] || [ "$FINAL_AMD64" = "null" ]; then
            echo "❌ [AMD64] 致命错误: 无法找到 AMD64 安装包！"
            exit 1
          fi
          echo "deb_url_amd64=$FINAL_AMD64" >> $GITHUB_OUTPUT

          # --- 步骤 2: 推导 ARM64 (基于 AMD64 链接修改) ---
          
          echo "🔍 [ARM64] 开始寻找下载链接..."
          
          # 智能推导: 将链接中的 amd64 替换为 arm64
          GUESS_ARM64="${FINAL_AMD64//amd64/arm64}"
          
          if curl --output /dev/null --silent --head --fail "$GUESS_ARM64"; then
            echo "✅ [ARM64] 智能推导成功: $GUESS_ARM64"
            FINAL_ARM64="$GUESS_ARM64"
          else
            echo "⚠️ [ARM64] 推导失败，尝试在 API 中搜索 arm64/aarch64..."
            if [ -z "$API_JSON" ]; then API_JSON=$(curl -fsSL "$API_URL"); fi
            FINAL_ARM64=$(echo "$API_JSON" | jq -r '.assets[] | select(.name | test("arm64.deb|aarch64.deb")) | .browser_download_url' | head -n 1)
          fi

          if [ -z "$FINAL_ARM64" ] || [ "$FINAL_ARM64" = "null" ]; then
             echo "⚠️ [ARM64] 未找到 ARM 版本，ARM 构建可能会失败 (或你可以选择跳过)"
             FINAL_ARM64=""
          else
             echo "🎯 [ARM64] 最终链接: $FINAL_ARM64"
          fi
          
          echo "deb_url_arm64=$FINAL_ARM64" >> $GITHUB_OUTPUT

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🏗️ 设置 QEMU (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ 生成 Docker 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-upstream.outputs.manager_version }}
            type=raw,value=${{ needs.check-upstream.outputs.combined_version }}

      - name: 🚀 构建并推送 (多架构)
        uses: docker/build-push-action@v5
        with:
          context: .
          # 同时构建 AMD64 和 ARM64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 传入通过 API/推导 获得的精准下载链接
          build-args: |
            DEB_URL_AMD64=${{ needs.check-upstream.outputs.deb_url_amd64 }}
            DEB_URL_ARM64=${{ needs.check-upstream.outputs.deb_url_arm64 }}
          no-cache: true

      - name: 📢 构建完成通知
        run: |
          echo "🎉 构建成功并已推送！"
          echo "📦 版本: ${{ needs.check-upstream.outputs.manager_version }}"
          echo "🐳 镜像: ${{ env.DOCKERHUB_REPO }}"