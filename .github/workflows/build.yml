name: 🐳 Build & Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制重新构建'
        required: false
        default: 'false'
  
  schedule:
    # 北京时间 03:00 (UTC 19:00)
    - cron: '0 19 * * *'

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/antigravity
  GITHUB_REPO: lbjlaq/Antigravity-Manager

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      manager_version: ${{ steps.check.outputs.manager_version }}
      deb_url: ${{ steps.resolve_url.outputs.deb_url }}
      combined_version: ${{ steps.check.outputs.combined_version }}
    
    steps:
      - name: 📥 获取最新版本号
        id: check
        run: |
          # 获取 Tag 名称 (例如 v1.2.3 或 1.2.3)
          TAG_NAME=$(curl -fsSL "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest" | jq -r '.tag_name')
          
          # 去除可能存在的 'v' 前缀用于版本号比较
          CLEAN_VERSION="${TAG_NAME#v}"
          
          echo "manager_version=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📌 最新版本: $TAG_NAME"
          
          COMBINED_VERSION="${TAG_NAME}-$(date +%Y%m%d)"
          echo "combined_version=$COMBINED_VERSION" >> $GITHUB_OUTPUT

          # 检查 Docker Hub 是否已存在
          DOCKER_TAGS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_REPO }}/tags?page_size=100" 2>/dev/null | jq -r '.results[].name' 2>/dev/null || echo "")
          
          if echo "$DOCKER_TAGS" | grep -q "^${TAG_NAME}$"; then
            echo "✅ 镜像版本 $TAG_NAME 已存在"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 需要构建新版本"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔗 解析下载链接 (含备用方案)
        id: resolve_url
        if: steps.check.outputs.should_build == 'true' || github.event.inputs.force_build == 'true' || github.event_name == 'push'
        run: |
          VERSION=${{ steps.check.outputs.manager_version }}
          # 去掉 v 前缀用于文件名拼接 (如果文件名里不带v)
          NO_V_VERSION="${VERSION#v}"
          
          echo "🔎 正在寻找下载链接..."

          # --- 方案 A: 构造标准下载链接 (速度最快) ---
          # 假设文件名格式为: Antigravity-Manager_1.1.0_amd64.deb
          TRY_URL="https://github.com/${{ env.GITHUB_REPO }}/releases/download/${VERSION}/Antigravity-Manager_${NO_V_VERSION}_amd64.deb"
          
          echo "1️⃣ 尝试方案 A (直接构造): $TRY_URL"
          if curl --output /dev/null --silent --head --fail "$TRY_URL"; then
            echo "✅ 方案 A 成功！链接有效。"
            echo "deb_url=$TRY_URL" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "⚠️ 方案 A 失败 (404 Not Found)。"
          fi

          # --- 方案 B: 使用 API 模糊搜索 (备用方案) ---
          echo "2️⃣ 启用方案 B (API 智能搜索)..."
          API_URL="https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest"
          
          # 使用 jq 查找包含 'amd64.deb' 的文件
          FALLBACK_URL=$(curl -fsSL "$API_URL" | jq -r '.assets[] | select(.name | contains("amd64.deb")) | .browser_download_url' | head -n 1)
          
          if [ ! -z "$FALLBACK_URL" ] && [ "$FALLBACK_URL" != "null" ]; then
            echo "✅ 方案 B 成功！找到链接: $FALLBACK_URL"
            echo "deb_url=$FALLBACK_URL" >> $GITHUB_OUTPUT
          else
            echo "❌ 所有方案均失败！无法找到 .deb 安装包。"
            exit 1
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true' || github.event.inputs.force_build == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-upstream.outputs.manager_version }}
            type=raw,value=${{ needs.check-upstream.outputs.combined_version }}

      - name: 🚀 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 核心改动：将解析好的 URL 传给 Docker
          build-args: |
            DEB_URL=${{ needs.check-upstream.outputs.deb_url }}
          no-cache: true

      - name: 📢 通知
        run: |
          echo "🎉 构建成功！"
          echo "📦 版本: ${{ needs.check-upstream.outputs.manager_version }}"
          echo "🔗 使用的源: ${{ needs.check-upstream.outputs.deb_url }}"